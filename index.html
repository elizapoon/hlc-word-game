<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>GUESS THE WORD!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: rgb(231, 130, 169);
            --blue: rgb(65, 143, 222);
            --grey: rgb(211, 211, 211);
            --border: #dcdcdc;
            --white: #ffffff;
            --key-bg: #e5e5e5;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents awkward scrolling */
        }

        body {
            background-color: var(--white);
            font-family: 'Fredoka', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Fix for mobile browser UI bars */
            height: 100vh;
            height: -webkit-fill-available;
            padding: 5px;
        }

        header { flex: 0 0 auto; padding: 5px 0; }
        h1 { margin: 0; font-size: clamp(1rem, 4vw, 1.4rem); letter-spacing: 2px; }

        .legend {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 5px 0;
            font-size: 0.7rem;
            background: #f9f9f9;
            padding: 6px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-box { width: 10px; height: 10px; border-radius: 2px; }
        .legend-box.pink { background-color: var(--pink); }
        .legend-box.blue { background-color: var(--blue); }
        .legend-box.grey { background-color: var(--grey); }

        #game-container {
            flex: 1 1 auto; /* This container grows and shrinks */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 0; /* Critical for flex shrinking */
        }

        #board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 4px;
            padding: 5px;
            height: 100%;
            max-height: 380px; /* Limits size on big screens */
            aspect-ratio: 5 / 6;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .tile {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1rem, 5vh, 1.4rem);
            font-weight: 600;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        /* Status Colors */
        .correct { background-color: var(--pink) !important; border-color: var(--pink) !important; color: white; }
        .present { background-color: var(--blue) !important; border-color: var(--blue) !important; color: white; }
        .absent { background-color: var(--grey) !important; border-color: var(--grey) !important; color: white; }

        #keyboard {
            flex: 0 0 auto; /* Keyboard stays at its preferred size */
            width: 100%;
            max-width: 480px;
            padding: 5px 0 15px 0; /* Extra bottom padding for "safe area" */
        }

        .kb-row {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
            touch-action: manipulation;
        }

        .key {
            background-color: var(--key-bg);
            border: none;
            border-radius: 4px;
            margin: 0 2px;
            height: clamp(40px, 7vh, 55px);
            flex: 1;
            font-family: inherit;
            font-weight: 600;
            font-size: clamp(0.7rem, 3vw, 0.9rem);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .key.wide { flex: 1.5; font-size: 0.7rem; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white; padding: 20px; border-radius: 20px; width: 85%; max-width: 380px;
            text-align: center; max-height: 80vh; overflow-y: auto;
        }
        .hidden { display: none !important; }
        .modal button.close-btn { 
            background: var(--blue); color: white; border: none; padding: 12px 30px; 
            border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

<header><h1>GUESS THE WORD!</h1></header>

<div class="legend">
    <div class="legend-item"><div class="legend-box pink"></div><span>Pink=Right</span></div>
    <div class="legend-item"><div class="legend-box blue"></div><span>Blue=Wrong Spot</span></div>
    <div class="legend-item"><div class="legend-box grey"></div><span>Grey=Incorrect</span></div>
</div>

<div id="game-container">
    <div id="board"></div>
</div>

<div id="keyboard">
    <div class="kb-row" id="row1"></div>
    <div class="kb-row" id="row2"></div>
    <div class="kb-row" id="row3"></div>
</div>

<div id="intro-modal" class="modal-overlay">
    <div class="modal">
        <h2>How To Play</h2>
        <p>Guess the word in 6 tries!</p>
        <p>Colors change to show how close you were.</p>
        <button class="close-btn" onclick="closeIntro()">PLAY</button>
    </div>
</div>

<div id="result-modal" class="modal-overlay hidden">
    <div class="modal">
        <div id="result-msg"></div>
        <button class="close-btn" onclick="location.reload()">OK</button>
    </div>
</div>

<script>
    const wordList = ["SLEEP", "HAPPY", "SWEAT", "SUGAR", "WATER", "CYCLE", "FRESH", "BLOOD", "OBESE", "HOBBY", "SPORT", "FOCUS", "CHUNK", "EXERT", "HABIT", "DAIRY", "JOINT", "DETOX", "CHECK", "FRUIT", "ROUTE", "GRAIN", "RELAX", "ENOKI", "HEART", "SQUAT", "FIBRE", "MUSIC", "BRISK", "INDEX", "LUNGE", "GLAND", "SPIKE", "SPEED", "DANCE", "QUIRK", "VITAL", "PLANK", "LIMIT", "GLUTE", "AGILE", "MACRO", "VEGAN", "LIPID", "COLON", "OMEGA", "LYMPH"];
    
    const startDate = new Date(2026, 4, 14); 
    const today = new Date();
    const diff = Math.floor((today.setHours(0,0,0,0) - startDate.setHours(0,0,0,0)) / 86400000);
    const targetWord = wordList[Math.max(0, diff % wordList.length)].toUpperCase();

    let currentGuess = "";
    let currentRow = 0;
    let gameOver = false;
    const keyMap = {}; // To track keyboard colors

    // Build Board
    const board = document.getElementById('board');
    for (let i = 0; i < 6; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        for (let j = 0; j < 5; j++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            row.appendChild(tile);
        }
        board.appendChild(row);
    }

    // Build Keyboard
    const rows = [
        ["Q","W","E","R","T","Y","U","I","O","P"],
        ["A","S","D","F","G","H","J","K","L"],
        ["DEL","Z","X","C","V","B","N","M","ENTER"]
    ];

    rows.forEach((row, i) => {
        const container = document.getElementById(`row${i+1}`);
        row.forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'key' + (key.length > 1 ? ' wide' : '');
            btn.textContent = key;
            btn.id = `key-${key}`;
            btn.onclick = () => handleInput(key);
            container.appendChild(btn);
            keyMap[key] = btn;
        });
    });

    function handleInput(key) {
        if (gameOver) return;
        if (key === "ENTER") submitGuess();
        else if (key === "DEL" || key === "BACKSPACE") {
            currentGuess = currentGuess.slice(0, -1);
            updateBoard();
        } else if (currentGuess.length < 5 && key.length === 1 && /[A-Z]/.test(key)) {
            currentGuess += key;
            updateBoard();
        }
    }

    function updateBoard() {
        const rowElements = document.getElementsByClassName('row');
        const tiles = rowElements[currentRow].children;
        for (let i = 0; i < 5; i++) {
            tiles[i].textContent = currentGuess[i] || "";
        }
    }

    async function submitGuess() {
        if (currentGuess.length !== 5) return;

        // Simple validation check
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${currentGuess}`);
        if (!response.ok) {
            alert("Not in word list!");
            return;
        }

        const tiles = document.getElementsByClassName('row')[currentRow].children;
        const targetArr = targetWord.split('');
        const guessArr = currentGuess.split('');
        const results = Array(5).fill('absent');

        // Pass 1: Correct (Pink)
        guessArr.forEach((letter, i) => {
            if (letter === targetArr[i]) {
                results[i] = 'correct';
                targetArr[i] = null;
                updateKeyColor(letter, 'correct');
            }
        });

        // Pass 2: Present (Blue)
        guessArr.forEach((letter, i) => {
            if (results[i] !== 'correct') {
                if (targetArr.includes(letter)) {
                    results[i] = 'present';
                    targetArr[targetArr.indexOf(letter)] = null;
                    updateKeyColor(letter, 'present');
                } else {
                    updateKeyColor(letter, 'absent');
                }
            }
        });

        // Apply colors to tiles
        for (let i = 0; i < 5; i++) {
            tiles[i].classList.add(results[i]);
        }

        if (currentGuess === targetWord) {
            endGame(true);
        } else if (currentRow === 5) {
            endGame(false);
        } else {
            currentRow++;
            currentGuess = "";
        }
    }

    function updateKeyColor(letter, status) {
        const btn = document.getElementById(`key-${letter}`);
        if (!btn) return;

        // Logic: Correct (pink) overrides Blue, Blue overrides Grey
        if (btn.classList.contains('correct')) return;
        if (btn.classList.contains('present') && status === 'absent') return;

        btn.classList.remove('present', 'absent');
        btn.classList.add(status);
    }

    function endGame(win) {
        gameOver = true;
        const msg = win 
            ? "✨ <b>Excellent!</b> ✨<br>You found the word." 
            : `😔 The word was <b>${targetWord}</b>`;
        document.getElementById('result-msg').innerHTML = msg;
        setTimeout(() => {
            document.getElementById('result-modal').classList.remove('hidden');
        }, 500);
    }

    function closeIntro() { document.getElementById('intro-modal').classList.add('hidden'); }

    window.addEventListener('keydown', e => {
        const key = e.key.toUpperCase();
        if (key === "ENTER") handleInput("ENTER");
        else if (key === "BACKSPACE") handleInput("DEL");
        else if (/^[A-Z]$/.test(key)) handleInput(key);
    });
</script>
</body>
</html>
